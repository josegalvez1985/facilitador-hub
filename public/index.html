<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover permite respetar el notch y la barra de inicio del iPhone en la PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Tu espacio educativo para organizar clases, materiales y marcaciones." />
    <meta name="theme-color" content="#7196cd" />
    <link rel="canonical" href="https://www.facilitadoresfc.online/" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, Telegram, LinkedIn…).
         Estos bots NO ejecutan JavaScript: las etiquetas tienen que estar acá, en el HTML.
         La imagen va con URL absoluta; con un logo cuadrado WhatsApp muestra la miniatura
         a la izquierda. WhatsApp guarda la vista previa de cada enlace un tiempo: un cambio
         puede tardar en verse en un enlace ya compartido. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="facilitadores" />
    <meta property="og:title" content="facilitadores" />
    <meta property="og:description" content="Tu espacio educativo para organizar clases, materiales y marcaciones." />
    <meta property="og:url" content="https://www.facilitadoresfc.online/" />
    <meta property="og:locale" content="es_PY" />
    <meta property="og:image" content="https://www.facilitadoresfc.online/logo.png" />
    <meta property="og:image:secure_url" content="https://www.facilitadoresfc.online/logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo de facilitadores" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="facilitadores" />
    <meta name="twitter:description" content="Tu espacio educativo para organizar clases, materiales y marcaciones." />
    <meta name="twitter:image" content="https://www.facilitadoresfc.online/logo.png" />

    <!-- Google: nombre del sitio en los resultados (WebSite) y el ícono que muestra al lado,
         que es el favicon (cuadrado, múltiplo de 48 px). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "facilitadores",
        "alternateName": "facilitadoresfc",
        "url": "https://www.facilitadoresfc.online/"
      }
    </script>

    <!-- PWA: instalación en iOS con "Agregar a pantalla de inicio" -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Facilitadores" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
